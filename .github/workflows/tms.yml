name: tms-collect

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # 15분마다 수집 (측정값은 30분 단위로 약 1~1.5시간 늦게 올라오며, API 는 최신값만 주므로 놓치지 않게 자주 확인)
    - cron: '10 18 * * *'          # 매일 03:10 KST 전일 가동시간 리포트 (전일 마지막 슬롯이 올라온 뒤)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tms-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prepare data branch
        run: |
          REMOTE="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --depth 1 --branch data "$REMOTE" data
          else
            mkdir data && cd data && git init -b data && git remote add origin "$REMOTE"
          fi

      - name: Collect
        if: github.event.schedule != '10 18 * * *'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          TMS_DB: data/tms.db
        run: python3 tms_collector.py collect

      - name: Daily report
        if: github.event.schedule == '10 18 * * *'
        env:
          TMS_DB: data/tms.db
        run: |
          D=$(TZ=Asia/Seoul date -d yesterday +%F)
          mkdir -p data/reports
          python3 tms_collector.py report --date "$D" --csv "data/reports/report_$D.csv"

      - name: Commit data
        run: |
          cd data
          git config user.name "tms-bot"
          git config user.email "tms-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "tms $(TZ=Asia/Seoul date '+%F %H:%M')"
          for i in 1 2 3; do
            git push origin data && break
            git pull --rebase origin data
            sleep 5
          done
