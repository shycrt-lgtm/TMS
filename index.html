<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TMS 발전상황 모니터링</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --text:#1c2430; --muted:#6b7686; --line:#e1e5ec;
    --head:#243447; --headtext:#fff; --group:#eaf0f8; --accent:#2b6cb0;
    --on:#22a05a; --warn:#c2410c;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12171e; --card:#1b222c; --text:#e6eaf0; --muted:#8e9aab; --line:#2d3745;
      --head:#2a3a4f; --headtext:#f2f5f9; --group:#223044; --accent:#6aa7e6;
      --on:#3fbf84; --warn:#f59e6b;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
       padding:20px 16px 40px}
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
  th{background:var(--head);color:var(--headtext);font-weight:600;padding:10px 12px;text-align:center;line-height:1.35}
  th small{display:block;font-weight:400;opacity:.8;font-size:11px}
  td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
  td.grp{background:var(--group);font-weight:700;text-align:center;border-right:1px solid var(--line);width:72px}
  td.fac{font-weight:600;border-right:1px solid var(--line)}
  td.unit{color:var(--muted);text-align:center;white-space:nowrap}
  td.state{text-align:center;width:120px}
  td.hours{text-align:center;width:130px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--on);vertical-align:middle}
  .dash{color:var(--muted);font-weight:700}
  .unk{color:var(--warn);font-weight:700}
  .t{display:block;font-size:11px;color:var(--muted);margin-top:2px}
  .msg{padding:36px 16px;text-align:center;color:var(--muted)}
  .foot{color:var(--muted);font-size:12px;margin-top:12px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <h1>TMS 발전상황 모니터링</h1>
  <p class="sub" id="sub">굴뚝자동측정기기(TMS) 기준</p>

  <div class="card"><div class="scroll"><div id="out" class="msg">불러오는 중…</div></div></div>

  <div class="foot">
    · <span class="dot" style="width:10px;height:10px"></span> 발전중 &nbsp; <span class="dash">-</span> 가동중지 &nbsp; <span class="unk">?</span> 판정불가(미수신·보수중·확인중 등)<br>
    · 현재 상태는 가장 최근 조회된 30분 슬롯 기준이며, 측정자료는 실제보다 약 1~1.5시간 늦게 올라옵니다.<br>
    · 전일 발전시간 = 배출구 중 하나라도 배출이 측정된 슬롯 수 × 0.5시간 (추정치). 판정불가·누락 슬롯이 있으면 ※로 표시합니다.
  </div>
</div>

<script>
// ▼ 저장소 주소 (바뀌면 여기만 수정)
const REPO = "shycrt-lgtm/tms-monitor", BRANCH = "data";
const raw = p => `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${p}`;

// 그룹 지정: 표시 순서는 config.json 순서를 따르고, 연속된 같은 그룹은 한 칸으로 병합
const GROUPS = [
  {name: "SCL", test: n => (/에스파워/.test(n) && !/디에스파워/.test(n)) || /광명사업단|안산도시개발/.test(n)},
  {name: "GS",  test: n => /GS파워|청라에너지|김포|인천종합에너지/.test(n)},
  {name: "SK",  test: n => /나래ES/.test(n)},
];
const groupOf = n => (GROUPS.find(g => g.test(n)) || {}).name || "";

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function yesterdayKST(){
  const t = new Date(Date.now() + 9*3600*1000 - 24*3600*1000);
  return `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(t.getUTCDate())}`;
}
const shortTs = s => s ? s.slice(5, 16).replace("T", " ") : "";   // 10-01 12:30

function parseCSV(text){
  text = text.replace(/^﻿/, "");
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ","){ row.push(cur); cur = ""; }
    else if (c === "\n"){ row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur !== "" || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.length > 1);
}
async function getText(path){
  const r = await fetch(raw(path), {cache: "no-cache"});
  return r.ok ? r.text() : null;
}

async function main(){
  const day = yesterdayKST();
  const [latestTxt, csvTxt] = await Promise.all([
    getText("latest.json").catch(() => null), getText(`reports/report_${day}.csv`).catch(() => null)]);
  const latest = latestTxt ? JSON.parse(latestTxt) : null;
  const rep = {};
  if (csvTxt) parseCSV(csvTxt).slice(1).forEach(r => rep[r[1] + "|" + r[2]] =
      {on: parseFloat(r[4]), na: parseInt(r[6], 10), n: parseInt(r[7], 10)});

  // 기본 행 목록: 최신 상태 파일 기준, 없으면 전일 리포트 기준
  let rows;
  if (latest) rows = latest.items.map(i => ({fac: i.facility, unit: i.unit, slot: i.slot, run: i.running}));
  else rows = Object.keys(rep).map(k => { const [fac, unit] = k.split("|"); return {fac, unit, slot: null, run: null, noLatest: true}; });
  if (!rows.length){ $("out").textContent = "표시할 데이터가 아직 없습니다. (첫 수집 이후 표시됩니다)"; return; }

  rows.forEach(r => { r.grp = groupOf(r.fac); r.rep = rep[r.fac + "|" + r.unit]; });
  rows.forEach((d, i) => {
    const p = rows[i-1];
    if (p && p.fac === d.fac) d.facSpan = 0;
    else { let k = i; while (k < rows.length && rows[k].fac === d.fac) k++; d.facSpan = k - i; }
    if (p && d.grp && p.grp === d.grp) d.grpSpan = 0;
    else { let k = i; while (k < rows.length && rows[k].grp === d.grp) k++; d.grpSpan = d.grp ? k - i : 0; }
  });

  const ls = latest && latest.latest_slot;
  $("sub").textContent = ls ? `현재 상태: ${shortTs(ls)} 슬롯 기준 · 전일(${day}) 누적 발전시간` : `전일(${day}) 누적 발전시간`;

  let h = `<table><thead><tr><th colspan="2">사업장</th><th>구분</th>
    <th>현재 상태<small>${ls ? shortTs(ls) + " 기준" : "-"}</small></th>
    <th>전일 발전시간<small>${day}</small></th></tr></thead><tbody>`;
  for (const d of rows){
    h += "<tr>";
    if (d.grpSpan) h += `<td class="grp" rowspan="${d.grpSpan}">${esc(d.grp)}</td>`;
    if (d.facSpan) h += `<td class="fac" ${d.grp ? "" : 'colspan="2"'} rowspan="${d.facSpan}">${esc(d.fac)}</td>`;
    h += `<td class="unit">${esc(d.unit)}</td>`;

    let st;
    if (d.noLatest) st = `<span class="dash">-</span>`;
    else if (d.run === 1) st = `<span class="dot" title="발전중"></span>`;
    else if (d.run === 0) st = `<span class="dash" title="가동중지">-</span>`;
    else st = `<span class="unk" title="판정불가">?</span>`;
    if (d.slot && ls && d.slot !== ls) st += `<span class="t">${shortTs(d.slot)}</span>`;   // 다른 시각 데이터면 표기
    h += `<td class="state">${st}</td>`;

    let hr = `<span class="dash">-</span>`;
    if (d.rep && !isNaN(d.rep.on)){
      const flag = d.rep.na > 0 || d.rep.n < 48 ? ` <span class="unk" title="판정불가·누락 슬롯 포함">※</span>` : "";
      hr = `<b>${d.rep.on.toFixed(1)}</b> h${flag}`;
    }
    h += `<td class="hours">${hr}</td></tr>`;
  }
  $("out").className = ""; $("out").innerHTML = h + "</tbody></table>";
}
main().catch(e => { $("out").textContent = "불러오지 못했습니다. 잠시 후 다시 시도해 주세요. (" + e.message + ")"; });
</script>
</body>
</html>
